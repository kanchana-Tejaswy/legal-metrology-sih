<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Rim -->
  <circle cx="100" cy="100" r="96" fill="#002147" stroke="#D97706" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFFFF" stroke-dasharray="3,3" stroke-width="2"/>
  
  <!-- Inner Rim -->
  <circle cx="100" cy="100" r="74" fill="#0A2540" stroke="#D97706" stroke-width="2"/>
  
  <!-- Center Emblem: Scale of Justice / Metrology Balance -->
  <!-- Beam -->
