  <!-- Central Pillar -->
  <rect x="97" y="55" width="6" height="75" fill="#E2E8F0"/>
  <polygon points="100,45 106,55 94,55" fill="#D97706"/>
  <!-- Base -->
  <path d="M75,135 Q100,128 125,135 L130,145 L70,145 Z" fill="#E2E8F0"/>
  
  <!-- Left Pan -->
  <line x1="56" y1="81" x2="44" y2="105" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="56" y1="81" x2="68" y2="105" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M40,105 Q56,118 72,105 Z" fill="#D97706"/>
  
  <!-- Right Pan -->
  <line x1="144" y1="81" x2="132" y2="105" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="144" y1="81" x2="156" y2="105" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M128,105 Q144,118 160,105 Z" fill="#D97706"/>
  
  <!-- Tricolor Accent Dot -->
  <circle cx="100" cy="78" r="4" fill="#15803D"/>
  <circle cx="100" cy="78" r="2" fill="#FFFFFF"/>
  
  <!-- Curved Text Placeholder (Department of Legal Metrology) -->
  <text x="100" y="32" fill="#FFFFFF" font-size="8.5" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">LEGAL METROLOGY</text>
  <text x="100" y="165" fill="#D97706" font-size="7" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">GOVERNMENT OF INDIA</text>
  <text x="100" y="176" fill="#94A3B8" font-size="5" font-family="sans-serif" text-anchor="middle">OFFICIAL VERIFICATION SYSTEM</text>
</svg>
